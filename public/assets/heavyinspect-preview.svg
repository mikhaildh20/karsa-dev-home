<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">HeavyInspect preview</title>
  <desc id="desc">Dark P2H heavy equipment inspection dashboard preview with operator, leader, and supervisor workflow cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14100a"/>
      <stop offset="0.5" stop-color="#1a1408"/>
      <stop offset="1" stop-color="#2b1d0a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="26" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.98 0 0 0 0 0.75 0 0 0 0 0.14 0 0 0 .55 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="44" fill="url(#bg)"/>
  <circle cx="146" cy="112" r="190" fill="#fbbf24" opacity=".18" filter="url(#glow)"/>
  <circle cx="1030" cy="120" r="220" fill="#f97316" opacity=".15" filter="url(#glow)"/>
  <rect x="74" y="72" width="1052" height="576" rx="34" fill="rgba(255,255,255,.055)" stroke="rgba(255,255,255,.15)"/>
  <rect x="110" y="112" width="980" height="80" rx="24" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.14)"/>
  <rect x="134" y="136" width="44" height="32" rx="8" fill="url(#amber)"/>
  <text x="156" y="160" text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-size="19" font-weight="800" fill="#1b1004">HI</text>
  <text x="204" y="162" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="850" fill="#fff8ee">HeavyInspect</text>
  <text x="760" y="160" font-family="JetBrains Mono,Consolas,monospace" font-size="20" fill="#d4c4a8">P2H • EDU-TRPAB</text>
  <g transform="translate(110 238)">
    <rect width="286" height="328" rx="28" fill="rgba(251,191,36,.10)" stroke="rgba(251,191,36,.34)"/>
    <rect x="28" y="32" width="120" height="38" rx="19" fill="url(#amber)"/>
    <text x="88" y="57" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#1b1004">Operator</text>
    <text x="28" y="118" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="850" fill="#fff8ee">P2H Report</text>
    <text x="28" y="158" font-family="Inter,Arial,sans-serif" font-size="19" fill="#d9c9ab">Daily inspection with</text>
    <text x="28" y="184" font-family="Inter,Arial,sans-serif" font-size="19" fill="#d9c9ab">photo evidence, GPS,</text>
    <text x="28" y="210" font-family="Inter,Arial,sans-serif" font-size="19" fill="#d9c9ab">QR scan and fluids.</text>
    <rect x="28" y="240" width="230" height="22" rx="11" fill="rgba(255,255,255,.12)"/>
    <rect x="28" y="240" width="160" height="22" rx="11" fill="#fbbf24"/>
    <text x="28" y="294" font-family="JetBrains Mono,Consolas,monospace" font-size="18" fill="#f3e3c2">unit: PC200-001</text>
  </g>
  <g transform="translate(456 238)">
    <rect width="286" height="328" rx="28" fill="rgba(249,115,22,.10)" stroke="rgba(249,115,22,.34)"/>
    <rect x="28" y="32" width="116" height="38" rx="19" fill="#f97316"/>
    <text x="86" y="57" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#1b1004">Leader</text>
    <text x="28" y="118" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="850" fill="#fff3e8">Review Flow</text>
    <text x="28" y="158" font-family="Inter,Arial,sans-serif" font-size="19" fill="#e0c0a2">Checklist review and</text>
    <text x="28" y="184" font-family="Inter,Arial,sans-serif" font-size="19" fill="#e0c0a2">real-time approval</text>
    <text x="28" y="210" font-family="Inter,Arial,sans-serif" font-size="19" fill="#e0c0a2">notifications.</text>
    <g stroke="#f97316" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M42 244l28 28 58-72"/>
      <path d="M144 244l28 28 58-72" opacity=".65"/>
    </g>
  </g>
  <g transform="translate(802 238)">
    <rect width="286" height="328" rx="28" fill="rgba(255,255,255,.075)" stroke="rgba(255,255,255,.16)"/>
    <rect x="28" y="32" width="122" height="38" rx="19" fill="#ffb86b"/>
    <text x="89" y="57" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#1b1004">Supervisor</text>
    <text x="28" y="118" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="850" fill="#fff8ee">Analytics</text>
    <text x="28" y="158" font-family="Inter,Arial,sans-serif" font-size="19" fill="#cbbba8">Dashboard stats and</text>
    <text x="28" y="184" font-family="Inter,Arial,sans-serif" font-size="19" fill="#cbbba8">final approval with</text>
    <text x="28" y="210" font-family="Inter,Arial,sans-serif" font-size="19" fill="#cbbba8">audit log trail.</text>
    <g fill="#fff8ee">
      <rect x="30" y="230" width="12" height="70"/>
      <rect x="52" y="230" width="7" height="70"/>
      <rect x="70" y="230" width="18" height="70"/>
      <rect x="100" y="230" width="8" height="70"/>
      <rect x="122" y="230" width="22" height="70"/>
      <rect x="158" y="230" width="10" height="70"/>
      <rect x="184" y="230" width="16" height="70"/>
      <rect x="214" y="230" width="8" height="70"/>
      <rect x="238" y="230" width="18" height="70"/>
    </g>
  </g>
